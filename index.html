<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f8e9f0">
  <meta name="description" content="Luna 的童话花园，每天一小步，让心愿开花。">
  <title>Luna 的童话花园</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="stylesheet" href="./style.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <header class="header">
      <a class="brand" href="#garden"><img src="./icon.svg" width="48" height="48" alt=""><span><strong>Luna 的童话花园</strong><small>每天一小步，让心愿开花</small></span></a>
      <nav aria-label="主导航"><button class="nav-button active" data-page="garden">✿ 童话地图</button><button class="nav-button" data-page="wishes">♡ 心愿商店</button></nav>
      <div class="header-tools"><button id="wallet-btn" class="wallet" aria-label="查看皇冠、魔法棒和心愿"><span class="crown-symbol" aria-hidden="true">♛</span><strong id="crown-balance">0</strong><span class="wallet-label">皇冠</span><i></i><span class="wand-symbol" aria-hidden="true">✧</span><strong id="wand-balance">0</strong><span class="wallet-label">魔法棒</span></button><button id="settings-btn" class="settings-button" aria-label="家长设置与备份">⚙</button></div>
    </header>
    <main><div id="content" aria-live="polite"></div><footer><span id="greeting">Luna 的小小冒险</span><span id="save-state" role="status">正在打开花园…</span></footer></main>
  </div>
  <dialog id="editor" aria-labelledby="dialog-title"><div id="dialog-content"></div></dialog>
  <div id="toast" class="toast" role="status" hidden></div>
  <input id="import-file" type="file" accept="application/json,.json" hidden>
  <noscript>请开启浏览器 JavaScript，才能打开童话花园。</noscript>
</body>
</html>
